                    cy="20%"

                    <stop offset="24%" stop-color="#ffb8b0"/>
                    <stop offset="55%" stop-color="#ef7180"/>
                    <stop offset="82%" stop-color="#d34861"/>
                    <stop offset="100%" stop-color="#8f2943"/>

                    id="middlePetal"
                    cx="28%"
                    cy="18%"
                    r="90%"

                    <stop offset="0%" stop-color="#ffe7de"/>
                    <stop offset="35%" stop-color="#fa9093"/>
                    <stop offset="70%" stop-color="#dc5269"/>
                    <stop offset="100%" stop-color="#a52e49"/>
                </radialGradient>

                    cx="25%"
                    cy="18%"

                    cy="20%"

                    <stop offset="60%" stop-color="#bc3651"/>
                    <stop offset="100%" stop-color="#7d2039"/>

                <linearGradient
                    id="leafGradient"
                    x1="0%"
                    y1="0%"
                    x2="100%"
                    y2="100%"

                    <stop offset="0%" stop-color="#91b86d"/>
                    <stop offset="45%" stop-color="#638d4c"/>
                    <stop offset="100%" stop-color="#345d3d"/>

                <radialGradient
                    id="budGradient"
                    cx="35%"
                    cy="25%"
                >
                    <stop offset="0%" stop-color="#ffd7d0"/>
                    <stop offset="50%" stop-color="#ec7481"/>
                    <stop offset="100%" stop-color="#9b3048"/>
                </radialGradient>

                    y="-150%"
                    width="400%"
                    height="400%"

                    id="softGlow"
                    x="-150%"
                    y="-150%"
                    width="400%"
                    height="400%"
                >
                    <feGaussianBlur stdDeviation="7"/>
